<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lecturer Attendance Dashboard</title>
  
  <!-- Primary CDN: jsDelivr (Official GitHub Mirror) -->
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@master/qrcode.min.js"></script>
  
  <!-- Automatic Fallback to unpkg CDN if jsDelivr fails to load -->
  <script>
    if (typeof QRCode === 'undefined') {
      document.write('<script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"><\/script>');
    }
  </script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background-color: #0f172a; color: #f8fafc; display: flex; height: 100vh; padding: 24px; gap: 24px; }
    .panel { background: #1e293b; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; }
    .qr-panel { flex: 1; align-items: center; justify-content: center; text-align: center; border: 1px solid #334155; }
    .roster-panel { flex: 1; border: 1px solid #334155; overflow-y: auto; }
    #qrcode { background: #ffffff; padding: 20px; border-radius: 12px; margin: 20px 0; }
    .timer-bar-bg { width: 100%; max-width: 300px; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .timer-bar-fill { height: 100%; width: 100%; background: #38bdf8; transition: width 0.1s linear; }
    .token-text { font-family: monospace; color: #94a3b8; font-size: 14px; margin-top: 12px; }
    .student-card { background: #0f172a; border-left: 4px solid #22c55e; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .demo-note { color: #fbbf24; font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
    .demo-button { border: 1px solid #38bdf8; background: #0369a1; color: white; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
    .demo-button:hover { background: #0284c7; }
  </style>
</head>
<body>

  <div class="panel qr-panel">
    <h2>Course: CS101 - Algorithms</h2>
    <p style="color: #94a3b8;">Scan with Student Attendance Mobile App</p>

    <div id="qrcode"></div>

    <div class="timer-bar-bg">
      <div id="timer-bar" class="timer-bar-fill"></div>
    </div>
    <div id="token-display" class="token-text">Payload: Initializing...</div>
  </div>

  <div class="panel roster-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Live Check-in Roster</h2>
      <span id="counter" style="background: #0369a1; padding: 6px 12px; border-radius: 20px; font-weight: bold;">0 Present</span>
    </div>
    <p class="demo-note">Offline demo: roster rows are simulated and do not come from the phone.</p>
    <button id="add-demo-row" class="demo-button" type="button">Add simulated check-in</button>
    <div id="roster-list"></div>
  </div>

  <script>
    const qrContainer = document.getElementById("qrcode");
    const timerBar = document.getElementById("timer-bar");
    const tokenDisplay = document.getElementById("token-display");
    const rosterList = document.getElementById("roster-list");
    const counter = document.getElementById("counter");

    const qrcode = new QRCode(qrContainer, {
      text: "INITIALIZING",
      width: 240,
      height: 240,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    let totalCount = 0;
    const REFRESH_INTERVAL_MS = 2000;
    let lastRefreshTime = Date.now();

    function updateQrCode() {
      const timestamp = Date.now();
      const nonce = Math.floor(100000 + Math.random() * 900000);
      const payload = JSON.stringify({ session: "CS101", nonce: nonce, ts: timestamp });

      qrcode.makeCode(payload);
      tokenDisplay.innerText = `Token: ${payload}`;
      lastRefreshTime = Date.now();
    }

    function animateProgressBar() {
      const elapsed = Date.now() - lastRefreshTime;
      const remainingRatio = Math.max(0, 1 - (elapsed / REFRESH_INTERVAL_MS));
      timerBar.style.width = (remainingRatio * 100) + "%";

      if (elapsed >= REFRESH_INTERVAL_MS) {
        updateQrCode();
      }
      requestAnimationFrame(animateProgressBar);
    }

    function addSimulatedStudent() {
      totalCount++;
      const studentId = `STU_25BCS${String(totalCount).padStart(3, '0')}`;
      const timeStr = new Date().toLocaleTimeString();

      const card = document.createElement("div");
      card.className = "student-card";
      card.innerHTML = `
        <div>
          <strong>${studentId}</strong>
          <div style="font-size: 12px; color: #fbbf24;">SIMULATED DEMO ROW · not submitted by the app</div>
        </div>
        <span style="color: #fbbf24; font-size: 13px;">${timeStr}</span>
      `;

      rosterList.prepend(card);
      counter.innerText = `${totalCount} Present`;
    }

    updateQrCode();
    requestAnimationFrame(animateProgressBar);
    document.getElementById("add-demo-row").addEventListener("click", addSimulatedStudent);
  </script>
</body>
</html>
