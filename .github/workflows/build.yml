name: Build APK
on: [push, workflow_dispatch] # Triggered on push, or manually triggered

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest defaults to a newer JDK; tflite_flutter mixes Java 11 with
      # that Kotlin target unless the toolchain is pinned.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Use stable version
          cache: true       # Enable cache to speed up subsequent builds

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug # Build debug version first to verify

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
